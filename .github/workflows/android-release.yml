name: Android Release Build

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licences and install SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          # compileSdk = 36 with minorApiLevel = 1 -> "Android SDK Platform 36.1"
          # AGP 9.1.1 requires SDK Build Tools 36.0.0.
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          sdkmanager "platforms;android-36.1" || \
            echo "::warning::platforms;android-36.1 not installable here; AGP will download it."

      - name: Prepare release signing key
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/my-upload-key.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using the keystore from the KEYSTORE_BASE64 repository secret."
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=repository-secret" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret found - generating a self-signed key for this build."
            GENERATED_STORE_PASSWORD="$(openssl rand -hex 16)"
            GENERATED_KEY_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA -keysize 2048 \
              -validity 10950 \
              -storepass "$GENERATED_STORE_PASSWORD" \
              -keypass "$GENERATED_KEY_PASSWORD" \
              -dname "CN=MyTube, OU=Mobile, O=MyTube, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$GENERATED_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$GENERATED_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=generated-ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Collect artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp -v {} dist/ \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp -v {} dist/ \;
          ls -lh dist
          for f in dist/*; do
            echo "$(basename "$f"): $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing key used: **${SIGNING_SOURCE}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: mytube-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
