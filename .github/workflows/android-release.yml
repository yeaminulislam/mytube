name: Android Release Build

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate Android SDK and accept licences
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error title=android-sdk-missing::no sdkmanager under $SDK"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          INSTALLED="$("$SDKMANAGER" --list_installed 2>/dev/null || "$SDKMANAGER" --list 2>/dev/null | head -40)"
          # Surface the installed package list as an annotation so it is readable
          # through the GitHub API even where raw job logs are unavailable.
          MSG="${INSTALLED//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::notice title=installed-sdk-packages::${MSG}"

      - name: Install SDK platform 36.1 and build-tools 36.0.0
        run: |
          set -uo pipefail
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # compileSdk = 36 with minorApiLevel = 1 -> "Android SDK Platform 36.1".
          # AGP downloads it itself when the licences are accepted.
          "$SDKMANAGER" "platforms;android-36.1" \
            || echo "::warning title=sdk-36-1::platforms;android-36.1 not installable via sdkmanager; AGP will try to fetch it."

      - name: Prepare release signing key
        run: |
          set -euo pipefail
          KEYSTORE_FILE="$RUNNER_TEMP/my-upload-key.jks"
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using the keystore from the KEYSTORE_BASE64 repository secret."
            printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=repository-secret" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret found - generating a self-signed key for this build."
            # The JDK default keystore type is PKCS12, which does not support a
            # separate key password - keytool silently ignores -keypass there and
            # AGP then fails with "Get Key failed: Given final block not properly
            # padded". So one password is used for both the store and the key.
            GENERATED_PASSWORD="$(openssl rand -hex 16)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA -keysize 2048 \
              -validity 10950 \
              -storepass "$GENERATED_PASSWORD" \
              -dname "CN=MyTube, OU=Mobile, O=MyTube, L=Dhaka, S=Dhaka, C=BD"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$GENERATED_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$GENERATED_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_SOURCE=generated-ephemeral" >> "$GITHUB_ENV"
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK and AAB
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          set +e
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}  java=$(java -version 2>&1 | head -1)"
          TAIL="$(tail -n 70 build.log 2>/dev/null)"
          if [ -z "$TAIL" ]; then
            TAIL="no build.log - the failure happened before Gradle ran; see the earlier step"
          fi
          MSG="${TAIL//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=release-build-failed::${MSG}"

      - name: Collect artefacts
        run: |
          set -euo pipefail
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp -v {} dist/ \;
          find app/build/outputs/bundle/release -name '*.aab' -exec cp -v {} dist/ \;
          ls -lh dist
          for f in dist/*; do
            echo "- \`$(basename "$f")\` — $(du -h "$f" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Signing key used: **${SIGNING_SOURCE}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify APK signature and manifest
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/36.0.0"
          REPORT=verify-report.txt
          : > "$REPORT"
          for apk in dist/*.apk; do
            {
              echo "=== $(basename "$apk") ($(du -h "$apk" | cut -f1)) ==="
              "$BT/aapt2" dump badging "$apk" | grep -E '^package|^sdkVersion|^targetSdkVersion|^application-label:' || true
              "$BT/apksigner" verify --verbose --print-certs "$apk" 2>&1 || echo 'apksigner verify FAILED'
            } >> "$REPORT"
          done
          for aab in dist/*.aab; do
            {
              echo "=== $(basename "$aab") ($(du -h "$aab" | cut -f1)) ==="
              echo "bundle: $(unzip -l "$aab" | grep -c 'base/manifest/AndroidManifest.xml' || true) base manifest, $(unzip -l "$aab" | tail -1 | awk '{print $2}') files"
            } >> "$REPORT"
          done
          cat "$REPORT"
          REPORT_TEXT="$(cat "$REPORT")"
          MSG="${REPORT_TEXT//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::notice title=artefact-verification::${MSG}"

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: mytube-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
